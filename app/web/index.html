<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Private sharing, right between your devices." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F7FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1726" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dropit" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Dropit</title>
    <link rel="manifest" href="manifest.json" />

    <script>
      // The value below is injected by flutter build, do not touch.
      var serviceWorkerVersion = null;
    </script>
    <!-- This script adds the flutter initialization JS code -->
    <script src="flutter.js" defer></script>
  </head>
  <body>
    <div id="bootstrap" role="status" aria-live="polite">
      <div class="bootstrap-mark">D</div>
      <strong>Starting Dropit</strong>
      <span id="bootstrap-message">Preparing private sharing…</span>
      <div class="bootstrap-spinner" aria-hidden="true"></div>
      <button id="bootstrap-retry" type="button" hidden>Reload</button>
    </div>
    <style>
      html, body { margin: 0; min-height: 100%; min-height: 100dvh; background: #f5f7fb; color: #0e1726; font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
      body { display: grid; place-items: center; overscroll-behavior: none; }
      body.flutter-ready { display: block; }
      #bootstrap { display: grid; justify-items: center; gap: 12px; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
      .bootstrap-mark { display: grid; place-items: center; width: 68px; height: 68px; margin-bottom: 8px; border-radius: 22px; background: #d9e7ff; color: #124b9d; font-size: 30px; font-weight: 800; }
      #bootstrap-message { color: #526078; }
      .bootstrap-spinner { width: 24px; height: 24px; margin-top: 8px; border: 3px solid #c9d5e8; border-top-color: #1762d1; border-radius: 50%; animation: spin .7s linear infinite; }
      #bootstrap-retry { min-width: 112px; min-height: 48px; margin-top: 8px; border: 0; border-radius: 14px; background: #1762d1; color: white; font: inherit; font-weight: 700; touch-action: manipulation; }
      #bootstrap-retry:active { transform: scale(.97); }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { html, body { background: #0e1726; color: #f5f8ff; } .bootstrap-mark { background: #203a60; color: #b8d5ff; } #bootstrap-message { color: #aab7ca; } }
      @media (prefers-reduced-motion: reduce) { .bootstrap-spinner { animation-duration: 1.4s; } }
    </style>
    <script>
      window.addEventListener("load", function (ev) {
        var bootstrap = document.getElementById("bootstrap");
        var message = document.getElementById("bootstrap-message");
        var retry = document.getElementById("bootstrap-retry");
        var timeout = new Promise(function (_, reject) {
          window.setTimeout(function () { reject(new Error("Startup timed out. Check your connection and reload.")); }, 30000);
        });
        // Download main.dart.js
        Promise.race([_flutter.loader
          .loadEntrypoint({
            serviceWorker: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
          })
          .then(function (engineInitializer) {
            return engineInitializer.initializeEngine();
          })
          .then(function (appRunner) {
            return appRunner.runApp();
          }), timeout]).then(function () {
            document.body.classList.add("flutter-ready");
            bootstrap.remove();
          }).catch(function (error) {
            message.textContent = error && error.message ? error.message : "Dropit could not start.";
            var spinner = document.querySelector(".bootstrap-spinner");
            if (spinner) spinner.hidden = true;
            retry.hidden = false;
          });
        retry.addEventListener("click", function () { window.location.reload(); });
      });
    </script>
  </body>
</html>
