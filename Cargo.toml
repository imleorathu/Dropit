[workspace]
resolver = "3"
members = [
    "cli",
    "packages/core",
    "packages/dropit_isolates/rust",
    "server",
]

# Profiles are only honored in the workspace root manifest.

# Full debuginfo dominates target/ size; line tables keep backtraces usable.
[profile.dev]
debug = "line-tables-only"

# RSA key generation is bignum-heavy and takes ~10x longer unoptimized;
# keep the crypto crates optimized in dev so tests stay fast.
[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2

# Prevent llvm-strip from mis-aligning the Mach-O LINKEDIT string pool on
# proc-macro dylibs when Xcode/Cargokit passes a long target-dir path.
[profile.release.build-override]
strip = "none"
