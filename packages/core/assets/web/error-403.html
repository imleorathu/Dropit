<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090E17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dropit">
    <title>Dropit — Direct Transfer</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230A84FF'/%3E%3Cstop offset='100%25' stop-color='%230055D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cpath d='M90 38 L90 122 M90 38 L54 74 M90 38 L126 74 M46 142 L134 142' stroke='white' stroke-width='14' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-color: #F3F6FA;
            --text-main: #0B1220;
            --text-sub: #64748B;
            --card-bg: #FFFFFF;
            --card-border: #D9E2EE;
            --card-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            --accent: #0A84FF;
            --accent-gradient: linear-gradient(135deg, #0A84FF, #0062E3);
            --accent-light: #E8F2FF;
            --radius-card: 24px;
            --radius-btn: 16px;
            --ease-spring: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0C121C;
                --text-main: #F8FAFC;
                --text-sub: #94A3B8;
                --card-bg: #151E2E;
                --card-border: #26334A;
                --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
                --accent: #0A84FF;
                --accent-gradient: linear-gradient(135deg, #2491FF, #0066EE);
                --accent-light: #162B4D;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            text-align: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 21px;
            background: var(--accent-gradient);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35);
            margin-bottom: 16px;
        }

        .brand-badge svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: white;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .surface-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            box-shadow: var(--card-shadow);
            padding: 34px 24px;
            max-width: 440px;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        p {
            font-size: 14.5px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            padding: 12px 22px;
            font-size: 15.5px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: transform 0.1s var(--ease-spring);
            text-decoration: none;
            user-select: none;
            touch-action: manipulation;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 6px 18px rgba(10, 132, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .app-footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="surface-card">
        <div class="brand-badge">
            <svg viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
        </div>
        <h1>Web Sharing Inactive</h1>
        <p>Dropit Browser Sharing is not enabled right now on your host device. Turn on Browser Sharing or Web Send on your host to transfer files.</p>
        <button class="btn" onclick="location.reload()">Check Again</button>
    </div>
    <div class="app-footer">Dropit • Direct peer-to-peer Wi-Fi transfer</div>
</body>
</html>
